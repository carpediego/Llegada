name: Publicar Llegada

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar app y paquete web
        run: npm run build

      - name: Preparar Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copiar assets web a Android
        run: node scripts/build-android.mjs

      - name: Preparar firma Android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta el secreto ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/llegada-release.jks"

      - name: Compilar APK Android
        env:
          LLEGADA_KEYSTORE: ${{ runner.temp }}/llegada-release.jks
          LLEGADA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LLEGADA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LLEGADA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Copiar y firmar metadatos del APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/downloads/llegada-$TAG.apk"
          node scripts/finalize-apk.mjs

      - name: Leer versión
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publicar release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          ZIP="dist/downloads/llegada-$TAG.zip"
          APK="dist/downloads/llegada-$TAG.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$APK" --clobber
            gh release edit "$TAG" --title "Llegada $TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" "$ZIP" "$APK" \
              --title "Llegada $TAG" \
              --notes-file dist/release-notes.md \
              --target "$GITHUB_SHA"
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
